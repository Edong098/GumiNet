[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guminet"
version = "0.1.0"
description = "CPU-first experimental lightweight convolutional networks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.3", "Pillow>=10", "numpy>=1.24", "PyYAML>=6", "tqdm>=4.66", "psutil>=5.9", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
tuning = ["optuna>=3.6"]
benchmark = ["torchvision>=0.17", "timm>=1.0"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2", "ruff>=0.6", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
guminet = "guminet.cli:main"

[tool.setuptools.packages.find]
include = ["guminet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
